<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Jarvis 3D AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(circle at center, #0c213d 0%, #030710 100%);
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: #00f0ff;
    touch-action: none;
    height: 100vh;
    width: 100vw;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #hud-top {
    position: fixed; top: 42px; width: 100%; text-align: center;
    pointer-events: none; z-index: 10; padding: 0 18px;
  }
  #title {
    font-size: 13px; letter-spacing: 3px; font-weight: 700;
    color: #00f0ff; text-shadow: 0 0 12px #00f0ff;
  }
  #status {
    font-size: 13px; margin-top: 8px; color: #b5f7ff;
    background: rgba(6, 20, 40, 0.65); display: inline-block;
    padding: 7px 15px; border-radius: 16px;
    border: 1px solid rgba(0, 240, 255, 0.3);
  }
  #toggle-ui {
    position: fixed; top: 40px; right: 16px; z-index: 30;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0, 240, 255, 0.15); color: #00f0ff;
    border: 1px solid rgba(0, 240, 255, 0.4); font-size: 14px;
  }
  #controls {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 400px; display: flex; gap: 8px; z-index: 20;
    background: rgba(8, 22, 42, 0.85); padding: 8px; border-radius: 30px;
    border: 1px solid rgba(0, 240, 255, 0.4);
    transition: opacity 0.25s ease;
  }
  #controls.hidden { opacity: 0; pointer-events: none; }
  #mic-btn {
    width: 42px; height: 42px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #00f0ff, #0077ff); color: #000;
    font-size: 18px; font-weight: bold; flex-shrink: 0;
  }
  #mic-btn.listening { background: #ff2a55; color: #fff; box-shadow: 0 0 15px #ff2a55; }
  #txt-input {
    flex: 1; background: transparent; border: none; color: #fff;
    font-size: 14px; outline: none; padding: 0 8px;
  }
  #send-btn {
    padding: 0 16px; border-radius: 20px; border: none;
    background: rgba(0, 240, 255, 0.22); color: #00f0ff; font-weight: 600;
  }
</style>
</head>
<body>
<div id="hud-top">
  <div id="title">JARVIS 3D CORE // ONLINE</div>
  <div><span id="status">3D Character par tap karein baat karne ke liye</span></div>
</div>

<button id="toggle-ui">👁️</button>

<div id="controls">
  <button id="mic-btn">🎤</button>
  <input id="txt-input" type="text" placeholder="Type karein (Time, Battery, Joke)..." />
  <button id="send-btn">SEND</button>
</div>

<canvas id="c"></canvas>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy, scale;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H * 0.47;
    scale = Math.min(W, H) * 0.25;
  }
  window.addEventListener('resize', resize);
  resize();

  // 3D Projection Math
  function proj(x, y, z, rx, ry) {
    const cy1 = Math.cos(ry), sy1 = Math.sin(ry);
    const x1 = x * cy1 - z * sy1;
    const z1 = x * sy1 + z * cy1;
    const cx1 = Math.cos(rx), sx1 = Math.sin(rx);
    const y2 = y * cx1 - z1 * sx1;
    const z2 = y * sx1 + z1 * cx1;
    const f = 4.0 / (4.0 + z2);
    return { x: cx + x1 * scale * f, y: cy - y2 * scale * f, z: z2, f: f };
  }

  // Particles
  const stars = Array.from({ length: 75 }, () => ({
    x: (Math.random() - 0.5) * 5.5,
    y: (Math.random() - 0.5) * 7.5,
    z: (Math.random() - 0.5) * 4.0
  }));

  let rotX = 0, rotY = 0, targetX = 0, targetY = 0;
  let isDragging = false, prevX = 0, prevY = 0, downTime = 0;
  let isSpeaking = false, speakTimer = null;

  const statusEl = document.getElementById('status');
  const micBtn = document.getElementById('mic-btn');
  const txtInput = document.getElementById('txt-input');
  const controlsEl = document.getElementById('controls');

  document.getElementById('toggle-ui').onclick = () => controlsEl.classList.toggle('hidden');

  window.addEventListener('pointerdown', (e) => {
    if (e.target.closest('#controls') || e.target.closest('#toggle-ui')) return;
    isDragging = true; prevX = e.clientX; prevY = e.clientY; downTime = Date.now();
  });
  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    targetY += (e.clientX - prevX) * 0.008;
    targetX += (e.clientY - prevY) * 0.008;
    prevX = e.clientX; prevY = e.clientY;
  });
  window.addEventListener('pointerup', () => {
    if (!isDragging) return;
    isDragging = false;
    if (Date.now() - downTime < 220) handleCommand("__tap__");
  });

  function speak(text) {
    statusEl.textContent = text;
    isSpeaking = true;
    clearTimeout(speakTimer);
    speakTimer = setTimeout(() => { isSpeaking = false; }, Math.max(2500, text.length * 80));

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'hi-IN';
      u.rate = 1.02;
      u.pitch = 1.05;
      u.onend = () => { isSpeaking = false; clearTimeout(speakTimer); };
      u.onerror = () => { isSpeaking = false; clearTimeout(speakTimer); };
      window.speechSynthesis.speak(u);
    }
  }

  async function handleCommand(raw) {
    const t = raw.toLowerCase().trim();
    if (!t) return;
    const now = new Date();
    const hr = now.getHours();
    const greet = hr < 12 ? "Good morning Boss!" : (hr < 17 ? "Good afternoon Boss!" : "Good evening Boss!");
    const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

    if (t === "__tap__") {
      const msgs = [
        `${greet} Abhi ${timeStr} ho rahe hain. Sabhi systems online hain.`,
        "Jarvis 3D Core active hai Boss! Koi command dijiye.",
        "Hello Boss! Main taiyar hoon, bataiye kya karna hai?"
      ];
      speak(msgs[Math.floor(Math.random() * msgs.length)]);
    } else if (t.includes("hello") || t.includes("hi") || t.includes("namaste") || t.includes("kaise ho")) {
      speak(`${greet} Main Jarvis hoon. Bataiye aaj main aapki kya madad kar sakta hoon?`);
    } else if (t.includes("time") || t.includes("samay") || t.includes("baje")) {
      speak(`Abhi ${timeStr} ho rahe hain Boss.`);
    } else if (t.includes("date") || t.includes("tarikh") || t.includes("din")) {
      speak(`Aaj ${now.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })} hai.`);
    } else if (t.includes("battery")) {
      if (navigator.getBattery) {
        const b = await navigator.getBattery();
        speak(`Phone ki battery abhi ${Math.round(b.level * 100)} percent hai Boss.`);
      } else {
        speak("Battery status ready hai Boss.");
      }
    } else if (t.includes("kaun ho") || t.includes("naam") || t.includes("who are you")) {
      speak("Main Jarvis hoon, aapka 3D holographic AI assistant.");
    } else if (t.includes("joke") || t.includes("chutkula")) {
      speak("Ek programmer kabhi dhoop mein bahar kyun nahi jata? Kyunki usse bahar bahut saare bugs milte hain!");
    } else {
      speak(`Aapne kaha: ${raw}. System command ready hai Boss!`);
    }
  }

  function startMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      speak("Is browser mein direct mic blocked hai Boss, mujh par tap karein ya niche type karein.");
      return;
    }
    const rec = new SR();
    rec.lang = 'en-IN';
    micBtn.classList.add('listening');
    statusEl.textContent = "Sun raha hoon... Boliye!";
    rec.onresult = (e) => {
      micBtn.classList.remove('listening');
      handleCommand(e.results[0][0].transcript);
    };
    rec.onerror = () => { micBtn.classList.remove('listening'); statusEl.textContent = "Dobara tap karein."; };
    rec.onend = () => micBtn.classList.remove('listening');
    rec.start();
  }

  micBtn.onclick = startMic;
  document.getElementById('send-btn').onclick = () => { handleCommand(txtInput.value); txtInput.value = ''; };
  txtInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { handleCommand(txtInput.value); txtInput.value = ''; } });

  function draw(ms) {
    const t = ms * 0.001;
    ctx.clearRect(0, 0, W, H);

    if (!isDragging) {
      targetY = Math.sin(t * 0.7) * 0.28;
      targetX = Math.cos(t * 0.5) * 0.09;
    }
    rotY += (targetY - rotY) * 0.08;
    rotX += (targetX - rotX) * 0.08;
    const bobY = Math.sin(t * 2.0) * 0.08;

    // Ambient Core Glow
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, scale * 1.9);
    grad.addColorStop(0, 'rgba(0, 240, 255, 0.22)');
    grad.addColorStop(0.6, 'rgba(0, 110, 255, 0.06)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 3D Particles
    stars.forEach((s, idx) => {
      const p = proj(s.x, s.y + Math.sin(t + idx) * 0.15, s.z, rotX * 0.3, rotY * 0.3 + t * 0.08);
      ctx.fillStyle = `rgba(0, 240, 255, ${Math.max(0.15, p.f * 0.55)})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(1, p.f * 2.2), 0, Math.PI * 2);
      ctx.fill();
    });

    // 3D Orbiting Rings
    for (let rIdx = 0; rIdx < 2; rIdx++) {
      const rad = rIdx === 0 ? 1.52 : 1.78;
      const tilt = rIdx === 0 ? 1.15 : -1.1;
      const spin = rIdx === 0 ? t * 0.9 : -t * 0.7;
      ctx.strokeStyle = rIdx === 0 ? 'rgba(0, 240, 255, 0.55)' : 'rgba(255, 195, 50, 0.45)';
      ctx.lineWidth = rIdx === 0 ? 2.2 : 1.6;
      ctx.beginPath();
      for (let i = 0; i <= 64; i++) {
        const a = (i / 64) * Math.PI * 2 + spin;
        const rx3 = Math.cos(a) * rad;
        const ry3 = Math.sin(a) * rad * Math.cos(tilt);
        const rz3 = Math.sin(a) * rad * Math.sin(tilt);
        const p = proj(rx3, ry3 + bobY, rz3, rotX, rotY);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    // 3D Holographic Head Sphere
    const lats = 10, lons = 16;
    for (let i = 1; i < lats; i++) {
      const phi = (i / lats) * Math.PI - Math.PI / 2;
      const rRing = Math.cos(phi);
      const yRing = Math.sin(phi);
      ctx.beginPath();
      for (let j = 0; j <= lons; j++) {
        const th = (j / lons) * Math.PI * 2;
        const p = proj(rRing * Math.cos(th), yRing + bobY, rRing * Math.sin(th), rotX, rotY);
        if (j === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.24)';
      ctx.lineWidth = 1.1;
      ctx.stroke();
    }
    for (let j = 0; j < lons; j++) {
      const th = (j / lons) * Math.PI * 2;
      ctx.beginPath();
      for (let i = 0; i <= lats; i++) {
        const phi = (i / lats) * Math.PI - Math.PI / 2;
        const p = proj(Math.cos(phi) * Math.cos(th), Math.sin(phi) + bobY, Math.cos(phi) * Math.sin(th), rotX, rotY);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.strokeStyle = 'rgba(0, 200, 255, 0.2)';
      ctx.lineWidth = 1.0;
      ctx.stroke();
    }

    // 3D Glowing Eyes (with Blink)
    const blink = (t % 3.6 > 3.45) ? 0.12 : 1.0;
    const eyeYCenter = 0.20 + bobY;
    const eyeHalfH = 0.045 * blink;
    [-1, 1].forEach((side) => {
      const x1 = side * 0.17, x2 = side * 0.48;
      const pts = [
        proj(x1, eyeYCenter + eyeHalfH, 0.94, rotX, rotY),
        proj(x2, eyeYCenter + eyeHalfH * 1.3, 0.86, rotX, rotY),
        proj(x2, eyeYCenter - eyeHalfH, 0.86, rotX, rotY),
        proj(x1, eyeYCenter - eyeHalfH, 0.94, rotX, rotY)
      ];
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      pts.forEach((pt, idx) => idx === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // 3D Lip-Sync Voice Equalizer Mouth
    for (let i = -2; i <= 2; i++) {
      const mx = i * 0.13;
      const barH = isSpeaking ? (0.04 + Math.abs(Math.sin(t * 18 + i * 1.4)) * 0.16) : 0.03;
      const topP = proj(mx, -0.32 + barH + bobY, 0.94, rotX, rotY);
      const botP = proj(mx, -0.32 - barH + bobY, 0.94, rotX, rotY);
      ctx.strokeStyle = '#00ffaa';
      ctx.shadowColor = '#00ffaa';
      ctx.shadowBlur = 10;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(topP.x, topP.y);
      ctx.lineTo(botP.x, botP.y);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
